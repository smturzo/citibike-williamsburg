name: daily

on:
  schedule:
    - cron: '15 8 * * *'   # 08:15 UTC = 04:15 ET (03:15 during EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull staged shards
        run: ops/collect_staging.sh origin data-staging

      - name: Backfill weather
        run: python3 collect/weather.py --days 7

      - name: Compact finished days
        run: python3 collect/compact.py

      - name: Build database
        run: python3 db/build_db.py

      - name: Rebuild dashboard stats
        run: python3 analysis/build_stats.py

      - name: Health report
        run: python3 ops/health.py

      - name: Size guard
        run: python3 ops/sizecheck.py --fail-over-budget

      - name: Commit rollup to main
        id: commit
        run: |
          git config user.name  "citibike-collector"
          git config user.email "actions@github.com"
          git add data docs/data config/station_keys.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "daily rollup: $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries" >&2; exit 1

      # Only after compaction is safely on main, or staged data would be lost.
      - name: Reset staging branch
        if: success()
        run: ops/reset_staging.sh origin data-staging
