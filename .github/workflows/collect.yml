name: collect

on:
  schedule:
    # Every 5 minutes. GitHub runs scheduled workflows on a best-effort basis and
    # will delay or drop them under load, so real spacing is irregular. That is
    # expected, and is why the Mac collector runs too - see README.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll GBFS
        run: python3 collect/collect.py --src gha

      # Shards go to a throwaway branch, never to main. See ops/push_shards.sh
      # for why: main's history must only ever receive compacted .csv.gz.
      - name: Stage shard
        run: ops/push_shards.sh origin data-staging
