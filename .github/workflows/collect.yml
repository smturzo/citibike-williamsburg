name: collect

on:
  schedule:
    # Every 5 minutes. GitHub runs scheduled workflows on a best-effort basis and
    # will delay or drop them under load, so real spacing is irregular. That is
    # expected and is why the Mac collector runs too - see README.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll GBFS
        run: python3 collect/collect.py --src gha

      - name: Commit shard
        run: |
          git config user.name  "citibike-collector"
          git config user.email "actions@github.com"
          git add data/raw data/coverage
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "collect: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Shards are uniquely named per (time, source) so concurrent writers
          # never touch the same file; a rebase is always sufficient.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          echo "push failed after retries" >&2; exit 1
